name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =========================================================
      # 1. Main GitHub Overview
      # =========================================================
      - name: 📊 GitHub Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Tanveer-Hakro
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata

      # =========================================================
      # 2. Languages
      # =========================================================
      - name: 🈷️ Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Tanveer-Hakro
          filename: metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

      # =========================================================
      # 3. Full-Year Contribution Calendar
      # =========================================================
      - name: 📅 Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Tanveer-Hakro
          filename: metrics-calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # =========================================================
      # 4. Coding Habits
      # =========================================================
      - name: 💡 Coding Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Tanveer-Hakro
          filename: metrics-habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes

      # =========================================================
      # 5. Lines of Code
      # =========================================================
      - name: 👨‍💻 Lines of Code
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Tanveer-Hakro
          filename: metrics-code.svg
          base: ""
          plugin_lines: yes
          plugin_lines_delay: 30
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1

      # =========================================================
      # 6. Recent GitHub Activity
      # =========================================================
      - name: 📰 Recent Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Tanveer-Hakro
          filename: metrics-activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 0
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes
          plugin_activity_filter: push, issue, pr, release, review, ref/create

      # =========================================================
      # 7. GitHub Skyline
      # =========================================================
      - name: 🌇 GitHub Skyline
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED
          user: Tanveer-Hakro
          filename: metrics-skyline.svg
          base: ""
          plugin_skyline: yes
          plugin_skyline_frames: 30
          plugin_skyline_quality: 0.5
